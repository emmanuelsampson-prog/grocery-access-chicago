   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #444444" transform="translate(7.2 291.176125)">Sources: verified event ledger and USDA authorization dates. Gap is an absolute calendar-day difference.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #444444" transform="translate(7.2 300.134375)">The physical event dates, rather than the authorization boundaries, define the focal comparisons.</text>
